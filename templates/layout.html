{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIL</title>
  <meta name="description" content="마크다운으로 쓰는 간단한 Today I Learned 기록장">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>

  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17161a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TIL">
  <script>
    // Ctrl+Enter (macOS 는 Cmd+Enter) 로 작성/수정 폼 저장.
    // 편집 폼은 HTMX 로 나중에 끼워 넣어지므로 document 에 위임해서 듣는다.
    document.addEventListener('keydown', function (e) {
      if (e.isComposing) return;
      if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
      var form = e.target.closest && e.target.closest('form.editor');
      if (!form) return;
      e.preventDefault();
      form.requestSubmit();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">TIL</a>
    <nav>
      {{if .LoggedIn}}
      <form method="post" action="/logout"><button class="link">로그아웃</button></form>
      {{else}}
      <a class="link" href="/login">로그인</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
