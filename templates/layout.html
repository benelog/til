{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIL</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">TIL</a>
    <nav>
      {{if .LoggedIn}}
      <form method="post" action="/logout"><button class="link">로그아웃</button></form>
      {{else}}
      <a class="link" href="/login">로그인</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
