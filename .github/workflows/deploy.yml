name: Deploy

# main 에 푸시하면 Cloud Run(도쿄, til-tokyo)에 재배포한다.
# 서울 서비스(til, asia-northeast3)는 롤백용이라 자동 배포에서 제외하고,
# 필요할 때 workflow_dispatch 로만 함께 배포한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'proxy/**'
      - 'netlify.toml'
  workflow_dispatch:
    inputs:
      deploy_seoul:
        description: '롤백용 서울 서비스(til)에도 같이 배포'
        type: boolean
        default: false

# 연달아 푸시해도 배포가 서로 앞지르지 않게 한 번에 하나만 돌린다.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT: benelog
  # 값은 비밀이 아니다. 서비스 계정 키 대신 Workload Identity Federation 을 쓰고,
  # 공급자에 benelog/til 저장소 조건이 걸려 있어 다른 저장소는 토큰을 받지 못한다.
  WIF_PROVIDER: projects/788537242173/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deployer@benelog.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # WIF 로 OIDC 토큰을 발급받는 데 필요하다.
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # 환경변수(TURSO_*, TIL_PASSWORD, TZ)는 서비스에 이미 등록돼 있고 리비전 간에
      # 유지된다. 그래서 여기서는 넘기지 않고, GitHub 에 시크릿도 두지 않는다.
      - name: Deploy to Cloud Run (도쿄)
        run: |
          gcloud run deploy til-tokyo --source . \
            --region asia-northeast1 --project "$PROJECT"

      - name: Deploy to Cloud Run (서울, 롤백용)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_seoul
        run: |
          gcloud run deploy til --source . \
            --region asia-northeast3 --project "$PROJECT"
